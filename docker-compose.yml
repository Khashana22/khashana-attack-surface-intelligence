services:
  platform:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://kasi:kasi_local_only@postgres:5432/kasi
    depends_on:
      postgres:
        condition: service_healthy
    networks: [local-lab]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kasi
      POSTGRES_USER: kasi
      POSTGRES_PASSWORD: kasi_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasi -d kasi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [local-lab]
networks:
  local-lab:
    internal: true
volumes:
  postgres_data:
